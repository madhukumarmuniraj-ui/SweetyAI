<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetyAI Glassy Island v16</title>
<style>
  :root{
    --sweety-color:#e7fbff;
    --sweety-alpha:.50;
    --text:#f5f7fb;
    --muted:#9da7b5;
    --glass:rgba(15,18,24,.55);
    --glass-strong:rgba(17,21,28,.72);
    --glass-edge:rgba(255,255,255,.14);
    --glass-highlight:rgba(255,255,255,.24);
    --accent:#7bdff2;
    --accent-2:#7aa7ff;
    --shadow:rgba(0,0,0,.36);
    --panel-radius:24px;
  }

  *{box-sizing:border-box}
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:visible;
    background:transparent !important;
  }
  body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    user-select:none;
    -webkit-user-select:none;
  }
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}

  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    pointer-events:none;
    overflow:visible;
  }

  #sweety-anchor{
    position:absolute;
    left:36px;
    top:36px;
    width:88px;
    height:88px;
    pointer-events:auto;
    touch-action:none;
    z-index:20;
  }

  #sweety-hit{
    position:absolute;
    inset:0;
    border-radius:30px;
  }

  .sweety-core{
    position:absolute;
    left:8px;
    top:8px;
    width:72px;
    height:72px;
    border-radius:28px;
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,.78) 0 11%, rgba(255,255,255,.12) 28%, transparent 52%),
      linear-gradient(145deg, rgba(255,255,255,.20), rgba(255,255,255,.05));
    opacity:var(--sweety-alpha);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:
      inset 10px 10px 22px rgba(255,255,255,.16),
      inset -12px -14px 24px rgba(0,0,0,.10),
      0 10px 28px rgba(0,0,0,.14),
      0 0 0 1px rgba(255,255,255,.06);
    backdrop-filter:blur(12px) saturate(145%);
    -webkit-backdrop-filter:blur(12px) saturate(145%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    transition:box-shadow .22s ease, transform .18s ease, border-color .22s ease, background .3s ease;
  }
  .sweety-core::before{
    content:"";
    position:absolute;
    left:10px;
    top:8px;
    width:34px;
    height:17px;
    border-radius:999px;
    background:linear-gradient(140deg,rgba(255,255,255,.78),rgba(255,255,255,0));
    filter:blur(1px);
    pointer-events:none;
  }
  .sweety-core::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.09);
    pointer-events:none;
  }

  #sweety-anchor:hover .sweety-core{
    border-color:rgba(255,255,255,.42);
    box-shadow:
      inset 10px 10px 22px rgba(255,255,255,.18),
      inset -12px -14px 24px rgba(0,0,0,.12),
      0 14px 34px rgba(0,0,0,.18),
      0 0 24px rgba(123,223,242,.10);
  }

  #sweety-anchor.dragging .sweety-core{
    transform:scale(1.05);
    box-shadow:
      inset 10px 10px 22px rgba(255,255,255,.18),
      inset -12px -14px 24px rgba(0,0,0,.15),
      0 18px 38px rgba(0,0,0,.22),
      0 0 30px rgba(123,223,242,.17);
  }

  .eye{
    width:8px;
    height:19px;
    border-radius:999px;
    background:#101318;
    position:relative;
    overflow:hidden;
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,.14),
      inset 0 -4px 6px rgba(0,0,0,.75),
      0 1px 1px rgba(255,255,255,.25);
    transition:transform .12s ease;
  }
  .eye::after{
    content:"";
    position:absolute;
    width:3px;
    height:5px;
    top:3px;
    right:2px;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    box-shadow:0 0 3px rgba(255,255,255,.45);
  }
  .eyelid{
    position:absolute;
    inset:0;
    background:rgba(232,250,255,.86);
    transform:translateY(-105%);
    transition:transform .12s cubic-bezier(.8,0,.2,1);
    border-radius:999px;
  }
  .blink .eyelid{transform:translateY(0)}

  /* Responsive glass popup */
  #popup{
    position:absolute;
    width:330px;
    max-width:calc(100vw - 24px);
    min-height:90px;
    pointer-events:auto;
    z-index:15;
    opacity:0;
    transform:scale(.94);
    visibility:hidden;
    transition:opacity .18s ease, transform .18s cubic-bezier(.2,.8,.2,1), left .22s ease, top .22s ease;
    transform-origin:center;
  }
  #popup.open{
    opacity:1;
    visibility:visible;
    transform:scale(1);
  }

  .glass-panel{
    background:
      linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.025)),
      var(--glass);
    border:1px solid var(--glass-edge);
    border-top-color:var(--glass-highlight);
    box-shadow:
      0 26px 60px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 0 40px rgba(255,255,255,.015);
    backdrop-filter:blur(24px) saturate(150%);
    -webkit-backdrop-filter:blur(24px) saturate(150%);
    border-radius:var(--panel-radius);
  }

  #menu{
    padding:12px;
  }
  .menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 7px 10px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .menu-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .action{
    appearance:none;
    border:1px solid rgba(255,255,255,.09);
    color:var(--text);
    min-height:74px;
    border-radius:18px;
    background:rgba(255,255,255,.035);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .action:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.17);
    box-shadow:0 10px 24px rgba(0,0,0,.14);
  }
  .action:active{transform:translateY(0) scale(.97)}
  .action .ico{font-size:19px}
  .action .label{font-size:11px}

  .panel{
    display:flex;
    flex-direction:column;
    min-height:420px;
    max-height:72vh;
    overflow:hidden;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 15px 11px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .title{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:700;
    font-size:14px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 12px rgba(123,223,242,.35);
  }
  .ghost{
    border:0;
    background:transparent;
    color:var(--muted);
    width:28px;height:28px;
    border-radius:10px;
  }
  .ghost:hover{background:rgba(255,255,255,.07);color:var(--text)}

  #messages{
    padding:14px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:0;
    flex:1;
  }
  #messages::-webkit-scrollbar{width:5px}
  #messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px}
  .msg{
    max-width:88%;
    padding:10px 12px;
    border-radius:15px;
    font-size:12.5px;
    line-height:1.42;
    white-space:pre-wrap;
    animation:pop .2s ease;
  }
  .ai{
    align-self:flex-start;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.06);
    border-top-left-radius:5px;
  }
  .user{
    align-self:flex-end;
    background:linear-gradient(135deg,rgba(109,184,255,.78),rgba(106,119,255,.72));
    border:1px solid rgba(255,255,255,.14);
    border-top-right-radius:5px;
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }

  .composer{
    display:flex;
    gap:8px;
    padding:11px;
    border-top:1px solid rgba(255,255,255,.07);
    background:rgba(0,0,0,.12);
  }
  #chat-input{
    flex:1;
    min-width:0;
    color:var(--text);
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    border-radius:15px;
    padding:10px 12px;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.16);
  }
  #chat-input:focus{
    border-color:rgba(123,223,242,.34);
    box-shadow:0 0 0 3px rgba(123,223,242,.08);
  }
  #send{
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    border-radius:15px;
    padding:0 13px;
    background:linear-gradient(135deg,rgba(103,181,255,.88),rgba(119,107,255,.86));
    box-shadow:0 8px 18px rgba(93,129,255,.18);
    transition:transform .15s ease,filter .15s ease;
  }
  #send:hover{filter:brightness(1.08)}
  #send:active{transform:scale(.96)}

  .code-wrap,.settings-wrap{
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:0;
    flex:1;
  }
  .toolbar{
    display:flex;
    gap:8px;
    align-items:center;
  }
  select,.small-btn{
    color:var(--text);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;
    padding:8px 10px;
    outline:none;
  }
  .small-btn:hover,select:hover{background:rgba(255,255,255,.08)}
  #code-editor{
    flex:1;
    min-height:250px;
    resize:none;
    border-radius:16px;
    padding:12px;
    color:#eef4ff;
    background:rgba(5,8,12,.50);
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    font:12px/1.5 "Cascadia Code","JetBrains Mono",Consolas,monospace;
    box-shadow:inset 0 1px 12px rgba(0,0,0,.22);
  }
  #code-editor:focus{
    border-color:rgba(123,223,242,.28);
    box-shadow:0 0 0 3px rgba(123,223,242,.06),inset 0 1px 12px rgba(0,0,0,.22);
  }
  .footer-row{
    display:flex;justify-content:space-between;gap:8px;align-items:center;
  }
  .status{font-size:11px;color:var(--muted)}
  .primary{
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    background:linear-gradient(135deg,rgba(102,185,255,.9),rgba(116,106,255,.88));
    border-radius:12px;
    padding:9px 12px;
  }

  .settings-list{display:flex;flex-direction:column;gap:9px}
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;gap:15px;
    padding:12px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:15px;
    background:rgba(255,255,255,.035);
  }
  .setting-row strong{font-size:12px}
  .setting-row span{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
  .setting-right{display:flex;align-items:center;gap:8px}
  input[type="checkbox"]{accent-color:#7bdff2;transform:scale(1.05)}

  .hidden{display:none !important}

  /* Light mode stays glassy */
  body.light{
    --text:#1d2430;
    --muted:#687180;
    --glass:rgba(247,250,255,.56);
    --glass-strong:rgba(250,252,255,.78);
    --glass-edge:rgba(20,35,50,.10);
    --glass-highlight:rgba(255,255,255,.86);
    --shadow:rgba(27,40,55,.16);
  }
  body.light .sweety-core{
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,.96) 0 11%, rgba(255,255,255,.32) 28%, transparent 52%),
      linear-gradient(145deg, rgba(255,255,255,.52), rgba(230,245,250,.16));
  }
  body.light .msg.ai{color:#27303b;background:rgba(255,255,255,.48);border-color:rgba(30,45,60,.08)}
  body.light #code-editor{color:#253040;background:rgba(255,255,255,.48)}
  body.light .setting-row,.light .action{border-color:rgba(30,45,60,.08);background:rgba(255,255,255,.34)}
</style>
</head>
<body>
<div id="stage">
  <div id="sweety-anchor" aria-label="Move Sweety">
    <div id="sweety-hit">
      <div id="sweety-logo" class="sweety-core">
        <div class="eye"><div class="eyelid"></div></div>
        <div class="eye"><div class="eyelid"></div></div>
      </div>
    </div>
  </div>

  <div id="popup">
    <div id="menu" class="glass-panel">
      <div class="menu-head"><span>SweetyAI</span><span>hold & drag • click to open</span></div>
      <div class="menu-actions">
        <button class="action" id="open-chat"><span class="ico">💬</span><span class="label">Chat</span></button>
        <button class="action" id="open-code"><span class="ico">⌘</span><span class="label">Code</span></button>
        <button class="action" id="open-settings"><span class="ico">⚙</span><span class="label">Settings</span></button>
      </div>
    </div>

    <div id="chat-panel" class="glass-panel panel hidden">
      <div class="panel-head">
        <div class="title"><span class="dot"></span>Chat</div>
        <button class="ghost" data-close>✕</button>
      </div>
      <div id="messages">
        <div class="msg ai">Coucou! I'm Sweety. Ask me anything. ✨</div>
      </div>
      <div class="composer">
        <input id="chat-input" autocomplete="off" placeholder="Talk to SweetyAI…">
        <button id="send">Send</button>
      </div>
    </div>

    <div id="code-panel" class="glass-panel panel hidden">
      <div class="panel-head">
        <div class="title"><span class="dot"></span>Code</div>
        <button class="ghost" data-close>✕</button>
      </div>
      <div class="code-wrap">
        <div class="toolbar">
          <select id="language">
            <option>Python</option><option>JavaScript</option><option>TypeScript</option>
            <option>HTML</option><option>CSS</option><option>JSON</option><option>Rust</option><option>SQL</option>
          </select>
          <button class="small-btn" id="clear-code">Clear</button>
        </div>
        <textarea id="code-editor" spellcheck="false" placeholder="Paste or write code here…"></textarea>
        <div class="footer-row">
          <span id="code-status" class="status">Ready</span>
          <button id="ask-code" class="primary">Ask SweetyAI</button>
        </div>
      </div>
    </div>

    <div id="settings-panel" class="glass-panel panel hidden">
      <div class="panel-head">
        <div class="title"><span class="dot"></span>Settings</div>
        <button class="ghost" data-close>✕</button>
      </div>
      <div class="settings-wrap">
        <div class="settings-list">
          <div class="setting-row">
            <div><strong>Theme</strong><span>Choose your glass theme</span></div>
            <div class="setting-right">
              <select id="theme-select"><option value="dark">Dark</option><option value="light">Light</option></select>
            </div>
          </div>
          <div class="setting-row">
            <div><strong>Enter to send</strong><span>Press Enter in chat to send</span></div>
            <div class="setting-right"><input id="enter-send" type="checkbox" checked></div>
          </div>
          <div class="setting-row">
            <div><strong>Always on top</strong><span>Keep Sweety above other windows</span></div>
            <div class="setting-right"><input id="always-on-top" type="checkbox" checked></div>
          </div>
          <div class="setting-row">
            <div><strong>Drag anywhere</strong><span>Press and hold Sweety, then release where you want</span></div>
            <div class="setting-right"><span>On</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const win = window.__TAURI__?.window?.getCurrentWindow?.();

  const stage = document.getElementById('stage');
  const anchor = document.getElementById('sweety-anchor');
  const logo = document.getElementById('sweety-logo');
  const popup = document.getElementById('popup');
  const menu = document.getElementById('menu');
  const chatPanel = document.getElementById('chat-panel');
  const codePanel = document.getElementById('code-panel');
  const settingsPanel = document.getElementById('settings-panel');
  const messages = document.getElementById('messages');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send');
  const enterSend = document.getElementById('enter-send');
  const alwaysOnTop = document.getElementById('always-on-top');
  const themeSelect = document.getElementById('theme-select');
  const codeEditor = document.getElementById('code-editor');
  const language = document.getElementById('language');
  const codeStatus = document.getElementById('code-status');

  let popupOpen = false;
  let openPanel = 'menu';
  let dragging = false;
  let dragStarted = false;
  let pressTimer = null;
  let startX = 0, startY = 0;
  let startScreenX = 0, startScreenY = 0;
  let lastX = 0, lastY = 0;

  function apiUrl(){ return 'http://127.0.0.1:8765/chat'; }

  function blink(){
    anchor.classList.add('blink');
    setTimeout(() => anchor.classList.remove('blink'), 130);
  }

  setInterval(() => {
    if (Math.random() < 0.7) blink();
  }, 2600);

  function setPanel(name){
    openPanel = name;
    [chatPanel, codePanel, settingsPanel].forEach(p => p.classList.add('hidden'));
    if(name === 'chat') chatPanel.classList.remove('hidden');
    if(name === 'code') codePanel.classList.remove('hidden');
    if(name === 'settings') settingsPanel.classList.remove('hidden');
    if(name === 'menu') menu.classList.remove('hidden');
    else menu.classList.add('hidden');
    positionPopup();
  }

  function openPopup(name='menu'){
    popupOpen = true;
    popup.classList.add('open');
    setPanel(name);
    requestAnimationFrame(() => positionPopup());
  }

  function closePopup(){
    popupOpen = false;
    popup.classList.remove('open');
  }

  function positionPopup(){
    const a = anchor.getBoundingClientRect();
    const p = popup.getBoundingClientRect();
    const gap = 10;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const spaces = {
      right: vw - a.right,
      left: a.left,
      top: a.top,
      bottom: vh - a.bottom
    };

    let side = 'right';
    if(spaces.right >= p.width + gap) side = 'right';
    else if(spaces.left >= p.width + gap) side = 'left';
    else if(spaces.top >= p.height + gap) side = 'top';
    else if(spaces.bottom >= p.height + gap) side = 'bottom';
    else{
      // When the Sweety is very near a corner, use the side with the most room.
      side = Object.entries(spaces).sort((a,b) => b[1] - a[1])[0][0];
    }

    let left, top;
    if(side === 'right'){
      left = a.right + gap;
      top = a.top + (a.height - p.height)/2;
    }else if(side === 'left'){
      left = a.left - p.width - gap;
      top = a.top + (a.height - p.height)/2;
    }else if(side === 'top'){
      left = a.left + (a.width - p.width)/2;
      top = a.top - p.height - gap;
    }else{
      left = a.left + (a.width - p.width)/2;
      top = a.bottom + gap;
    }

    // Never let the glass panel leave the native transparent window.
    left = Math.max(8, Math.min(left, vw - p.width - 8));
    top = Math.max(8, Math.min(top, vh - p.height - 8));

    popup.style.left = `${left}px`;
    popup.style.top = `${top}px`;
    popup.style.transformOrigin =
      side === 'right' ? 'left center' :
      side === 'left' ? 'right center' :
      side === 'top' ? 'center bottom' : 'center top';
  }

  function appendMessage(text, kind='ai'){
    const div = document.createElement('div');
    div.className = `msg ${kind}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function extractReply(payload){
    if(typeof payload === 'string') return payload.trim();

    const keys = [
      'reply','response','answer','message','output',
      'content','text','result','completion'
    ];

    for(const key of keys){
      const value = payload?.[key];
      if(typeof value === 'string' && value.trim()) return value.trim();
      if(value && typeof value === 'object'){
        const nested = extractReply(value);
        if(nested) return nested;
      }
    }

    if(payload && typeof payload === 'object'){
      try{
        return JSON.stringify(payload, null, 2);
      }catch{}
    }

    return '';
  }

  async function sendMessage(text){
    const trimmed = text.trim();
    if(!trimmed) return;

    appendMessage(trimmed, 'user');
    chatInput.value = '';
    blink();
    appendMessage('Thinking…', 'ai');
    const thinking = messages.lastElementChild;

    try{
      const r = await fetch(apiUrl(), {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Accept':'application/json, text/plain'
        },
        body:JSON.stringify({message: trimmed})
      });

      const raw = await r.text();
      let data = raw;
      try{ data = JSON.parse(raw); }catch{}

      if(!r.ok){
        const serverError = extractReply(data);
        throw new Error(serverError || `HTTP ${r.status}`);
      }

      const reply = extractReply(data);
      thinking.textContent = reply || 'SweetyAI returned an empty response.';
    }catch(e){
      thinking.textContent =
        `Chat error: ${e.message || 'Backend unavailable'}.`;
    }

    messages.scrollTop = messages.scrollHeight;
  }

  async function askAboutCode(){
    const code = codeEditor.value.trim();
    if(!code){
      codeStatus.textContent = 'Write or paste code first';
      return;
    }
    codeStatus.textContent = 'Sending…';
    const prompt = `Review this ${language.value} code and help me with it:\\n\\n${code}`;
    setPanel('chat');
    openPopup('chat');
    await sendMessage(prompt);
    codeStatus.textContent = 'Sent to SweetyAI';
  }

  // Click opens. Holding moves Sweety while keeping the transparent native window on-screen.
  async function getScreenMetrics(){
    let scale = 1;
    let screenX = 0, screenY = 0, screenW = window.screen.availWidth, screenH = window.screen.availHeight;
    try{
      if(win){
        scale = await win.scaleFactor();
      }
    }catch{}
    // CSS pixels are enough for local placement; native position uses the window API.
    return {scale, screenX, screenY, screenW, screenH};
  }

  function setAnchorLocal(x, y){
    const maxX = Math.max(8, window.innerWidth - anchor.offsetWidth - 8);
    const maxY = Math.max(8, window.innerHeight - anchor.offsetHeight - 8);
    const nx = Math.max(8, Math.min(x, maxX));
    const ny = Math.max(8, Math.min(y, maxY));
    anchor.style.left = `${nx}px`;
    anchor.style.top = `${ny}px`;
  }

  let dragWindowStart = null;
  let dragLocalStart = null;

  anchor.addEventListener('pointerdown', async (e) => {
    e.preventDefault();
    startX = e.clientX;
    startY = e.clientY;
    startScreenX = e.screenX;
    startScreenY = e.screenY;
    lastX = startX;
    lastY = startY;
    dragStarted = false;
    clearTimeout(pressTimer);

    pressTimer = setTimeout(async () => {
      dragging = true;
      dragStarted = true;
      anchor.classList.add('dragging');
      closePopup();

      try{
        const pos = await win?.outerPosition();
        dragWindowStart = pos ? {x:pos.x, y:pos.y} : {x:0, y:0};
      }catch{
        dragWindowStart = {x:0, y:0};
      }

      dragLocalStart = {
        x: anchor.offsetLeft,
        y: anchor.offsetTop
      };

      anchor.setPointerCapture?.(e.pointerId);
    }, 180);
  });

  anchor.addEventListener('pointermove', async (e) => {
    lastX = e.clientX;
    lastY = e.clientY;
    if(!dragging) return;

    const dx = e.screenX - startScreenX;
    const dy = e.screenY - startScreenY;

    // Move the native window only as much as possible, while keeping it
    // completely on-screen.
    let desiredWX = dragWindowStart.x + dx;
    let desiredWY = dragWindowStart.y + dy;

    const screen = await getScreenMetrics();

    // Keep the whole 760x560 window on-screen. Then place Sweety at the
    // pointer-relative location inside that window. This makes Sweety usable
    // at the very bottom/edges without clipping its popup.
    const winW = window.outerWidth;
    const winH = window.outerHeight;

    desiredWX = Math.max(screen.screenX, Math.min(
      desiredWX,
      screen.screenX + screen.screenW - winW
    ));
    desiredWY = Math.max(screen.screenY, Math.min(
      desiredWY,
      screen.screenY + screen.screenH - winH
    ));

    try{
      await win?.setPosition({
        type:"Physical",
        x:Math.round(desiredWX),
        y:Math.round(desiredWY)
      });
    }catch{}

    // Preserve the cursor relationship to Sweety after the native window is clamped.
    const actualWX = desiredWX;
    const actualWY = desiredWY;
    const actualWindowDX = actualWX - dragWindowStart.x;
    const actualWindowDY = actualWY - dragWindowStart.y;

    // Keep the point originally grabbed on Sweety under the pointer.
    const targetLocalX = dragLocalStart.x + dx - actualWindowDX;
    const targetLocalY = dragLocalStart.y + dy - actualWindowDY;

    setAnchorLocal(targetLocalX, targetLocalY);
    if(popupOpen) positionPopup();
  });

  anchor.addEventListener('pointerup', async (e) => {
    clearTimeout(pressTimer);
    anchor.classList.remove('dragging');

    if(dragging){
      dragging = false;
      anchor.releasePointerCapture?.(e.pointerId);
      setTimeout(() => openPopup('menu'), 90);
      return;
    }

    const dx = Math.abs(e.screenX - startScreenX);
    const dy = Math.abs(e.screenY - startScreenY);

    if(!dragStarted && dx < 6 && dy < 6){
      popupOpen ? closePopup() : openPopup('menu');
    }
  });

  anchor.addEventListener('pointercancel', (e) => {
    clearTimeout(pressTimer);
    dragging = false;
    anchor.classList.remove('dragging');
    anchor.releasePointerCapture?.(e.pointerId);
  });

  window.addEventListener('resize', () => {
    if(popupOpen) positionPopup();
  });

  document.getElementById('open-chat').onclick = () => openPopup('chat');
  document.getElementById('open-code').onclick = () => openPopup('code');
  document.getElementById('open-settings').onclick = () => openPopup('settings');

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.onclick = () => closePopup();
  });

  sendBtn.onclick = () => sendMessage(chatInput.value);
  chatInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      if(enterSend.checked && !e.shiftKey){
        e.preventDefault();
        sendMessage(chatInput.value);
      }
    }
  });

  document.getElementById('clear-code').onclick = () => {
    codeEditor.value = '';
    codeStatus.textContent = 'Cleared';
    codeEditor.focus();
  };
  document.getElementById('ask-code').onclick = askAboutCode;

  themeSelect.addEventListener('change', () => {
    document.body.classList.toggle('light', themeSelect.value === 'light');
    localStorage.setItem('sweety-theme', themeSelect.value);
  });

  alwaysOnTop.addEventListener('change', async () => {
    try { await win?.setAlwaysOnTop(alwaysOnTop.checked); } catch {}
  });

  // Keep the app always-on-top by default.
  try { await win?.setAlwaysOnTop(true); } catch {}

  const savedTheme = localStorage.getItem('sweety-theme') || 'dark';
  themeSelect.value = savedTheme;
  document.body.classList.toggle('light', savedTheme === 'light');

  // Cursor-following face.
  let tx = 0, ty = 0, cx = 0, cy = 0;
  document.addEventListener('mousemove', e => {
    const r = logo.getBoundingClientRect();
    tx = Math.max(-1, Math.min(1, (e.clientX - (r.left+r.width/2)) / 260));
    ty = Math.max(-1, Math.min(1, (e.clientY - (r.top+r.height/2)) / 220));
  });
  function animate(){
    cx += (tx-cx)*.12;
    cy += (ty-cy)*.12;
    logo.style.transform = `perspective(420px) rotateY(${cx*16}deg) rotateX(${-cy*16}deg)`;
    document.querySelectorAll('.eye').forEach(el => {
      el.style.transform = `translate(${cx*3.5}px,${cy*3.5}px)`;
    });
    requestAnimationFrame(animate);
  }
  animate();

  // First popup chooses the best visible side; the window itself can now live anywhere.
  setTimeout(() => { positionPopup(); }, 80);
</script>
</body>
</html>
