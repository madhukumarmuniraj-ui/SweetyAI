[package]
name = "sweetyai_ui"
version = "0.1.0"
description = "SweetyAI desktop assistant UI"
authors = ["SweetyAI"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.12.1" }

[dependencies]
tauri = { version = "2.12.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
