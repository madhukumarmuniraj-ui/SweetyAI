<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#0A0D14"/>
  
  <!-- Single continuous line forming M - X -->
  <path d="M 110,340 
           L 180,160 
           L 250,280 
           L 320,160 
           L 390,340 
           M 215,310 
           L 285,190" 
        fill="none" 
        stroke="url(#lineGradient)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Minimalist Accent Line -->
  <line x1="200" y1="370" x2="300" y2="370" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Typography -->
  <text x="250" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" 
        font-weight="300" 
        letter-spacing="14" 
        fill="#F8FAFC" 
        text-anchor="middle">MADMAX</text>

  <!-- Color Gradients -->
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
</svg>
