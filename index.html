<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweety AI - Chat</title>
    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com">
        // Added Enter key handler
        document.addEventListener('DOMContentLoaded', () => {
            const ta = document.getElementById('textarea') || document.querySelector('textarea');
            if (ta) {
                ta.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if (typeof handleSendMessage === 'function') {
                            handleSendMessage(e);
                        } else if (typeof sendMessage === 'function') {
                            sendMessage();
                        }
                    }
                });
            }
        });
        </script>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#1e1e1e] text-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- SIDEBAR -->
    <div id="sidebar" class="w-64 bg-[#171717] flex flex-col justify-between border-r border-gray-800 transition-all duration-300">
        <div>
            <!-- New Chat Button -->
            <div class="p-3">
                <button onclick="newChat()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-700 hover:bg-gray-800 text-sm font-medium transition">
                    <i class="fa-solid fa-plus text-xs"></i> New chat
                </button>
            </div>
            <!-- Chat History List -->
            <div class="px-3 py-2 space-y-1 overflow-y-auto max-h-[calc(100vh-130px)] text-sm">
                <div class="text-xs font-semibold text-gray-500 px-3 py-1">Today</div>
                <button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-800 truncate text-gray-300 transition">Sweety AI Architecture</button>
                <button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-800 truncate text-gray-300 transition">Electron IPC setup</button>
            </div>
        </div>
        <!-- User Profile / Footer -->
        <div class="p-3 border-t border-gray-800 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">S</div>
            <span class="text-sm font-medium truncate">Sweety AI User</span>
        </div>
    </div>

    <!-- MAIN CHAT CONTAINER -->
    <div class="flex-1 flex flex-col h-full bg-[#212121]">
        
        <!-- Top Bar -->
        <div class="h-14 border-b border-gray-800 flex items-center px-4 justify-between bg-[#212121]">
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white px-2 py-1 rounded">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="text-sm font-semibold text-gray-300">Sweety AI v1.0</span>
            <div class="w-6"></div> <!-- Balance spacer -->
        </div>

        <!-- Chat History Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Welcome Greeting -->
            <div class="max-w-3xl mx-auto text-center mt-12 space-y-3">
                <h1 class="text-3xl font-bold tracking-tight">What can I help with today?</h1>
            </div>
        </div>

        <!-- Bottom Input Form -->
        <div class="p-4 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent">
            <div class="max-w-3xl mx-auto">
                <form id="chat-form" onsubmit="handleSendMessage(event)" class="relative bg-[#2f2f2f] rounded-2xl border border-gray-700 focus-within:border-gray-500 shadow-lg">
                    <textarea id="textarea" id="user-input" rows="1" placeholder="Message Sweety AI..." 
                        class="w-full bg-transparent px-4 py-3.5 pr-12 text-gray-100 placeholder-gray-400 focus:outline-none resize-none max-h-48 text-sm"
                        onkeydown="handleKeyDown(event)"></textarea>
                    <button type="submit" id="send-btn" class="absolute right-2.5 bottom-2.5 bg-white text-black p-2 rounded-xl hover:bg-gray-200 transition disabled:opacity-40" disabled>
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </form>
                <div class="text-center text-xs text-gray-500 mt-2">
                    Sweety AI can make mistakes. Verify important info.
                </div>
            </div>
        </div>

    </div>

    <!-- Script to handle chat logic and UI interactions -->
    <script>
        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');

        // Auto-enable send button on text input
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (textarea.value.trim() !== '') {
                    document.getElementById('chat-form').dispatchEvent(new Event('submit'));
                }
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-0');
            sidebar.classList.toggle('overflow-hidden');
        }

        function newChat() {
            chatContainer.innerHTML = `
                <div class="max-w-3xl mx-auto text-center mt-12 space-y-3">
                    <h1 class="text-3xl font-bold tracking-tight">What can I help with today?</h1>
                </div>`;
        }

        function handleSendMessage(event) {
            event.preventDefault();
            const message = textarea.value.trim();
            if (!message) return;

            if (chatContainer.querySelector('h1')) {
                chatContainer.innerHTML = '';
            }

            const userBubble = document.createElement('div');
            userBubble.className = 'max-w-3xl mx-auto flex gap-4 px-4';
            userBubble.innerHTML = `<div class="w-8 h-8 rounded-full bg-indigo-600 flex-shrink-0 flex items-center justify-center font-bold text-sm">U</div><div class="flex-1 space-y-1 text-gray-200 text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(message)}</div>`;
            chatContainer.appendChild(userBubble);

            textarea.value = '';
            textarea.style.height = 'auto';
            sendBtn.disabled = true;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const isRagMode = document.getElementById('ragToggle') ? document.getElementById('ragToggle').checked : true;
            const endpoint = isRagMode ? "http://127.0.0.1:8765/rag-chat" : "http://127.0.0.1:8765/chat";
            
            fetch(endpoint,, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                sendBtn.disabled = false;
                const aiBubble = document.createElement('div');
                aiBubble.className = 'max-w-3xl mx-auto flex gap-4 px-4 bg-[#2a2a2a]/50 py-4 rounded-xl';
                const replyText = data.response || data.reply || data.answer || JSON.stringify(data);
                aiBubble.innerHTML = `<div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center font-bold text-sm">S</div><div class="flex-1 space-y-1 text-gray-200 text-sm leading-relaxed">${escapeHtml(replyText)}</div>`;
                chatContainer.appendChild(aiBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            })
            .catch(error => {
                sendBtn.disabled = false;
                const errBubble = document.createElement('div');
                errBubble.className = 'max-w-3xl mx-auto flex gap-4 px-4 bg-red-900/50 py-4 rounded-xl';
                errBubble.innerHTML = `<div class="flex-1 text-red-200 text-sm">Backend Connection Error: Cannot reach the Python server.</div>`;
                chatContainer.appendChild(errBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    
        // Added Enter key handler
        document.addEventListener('DOMContentLoaded', () => {
            const ta = document.getElementById('textarea') || document.querySelector('textarea');
            if (ta) {
                ta.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if (typeof handleSendMessage === 'function') {
                            handleSendMessage(e);
                        } else if (typeof sendMessage === 'function') {
                            sendMessage();
                        }
                    }
                });
            }
        });
        </script>
        

    <script>
    // Robust Enter-key handler for SweetyAI
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'TEXTAREA' || activeEl.id === 'chat-input' || activeEl.id === 'textarea')) {
                event.preventDefault();
                if (typeof handleSendMessage === 'function') {
                    handleSendMessage(event);
                } else if (typeof sendMessage === 'function') {
                    sendMessage();
                } else {
                    const sendBtn = document.getElementById('send-btn') || document.getElementById('sendBtn');
                    if (sendBtn) sendBtn.click();
                }
            }
        }
    });
    </script>
    
    <script>
    // SweetyAI Robust Input Controller (Enter to send, Up-arrow for history)
    (function() {
        let messageHistory = [];
        let historyIndex = -1;

        document.addEventListener('DOMContentLoaded', () => {
            // Find input dynamically (supports textarea or input with id chat-input, textarea, etc.)
            const inputEl = document.getElementById('chat-input') || document.getElementById('textarea') || document.querySelector('textarea') || document.querySelector('input[type="text"]');
            const sendBtn = document.getElementById('send-btn') || document.getElementById('sendBtn');

            if (!inputEl) return;

            inputEl.addEventListener('keydown', function(e) {
                // Up Arrow: History recall
                if (e.key === 'ArrowUp') {
                    if (messageHistory.length > 0) {
                        e.preventDefault();
                        if (historyIndex < messageHistory.length - 1) {
                            historyIndex++;
                        }
                        inputEl.value = messageHistory[messageHistory.length - 1 - historyIndex];
                    }
                    return;
                }

                // Down Arrow: Next history item
                if (e.key === 'ArrowDown') {
                    if (historyIndex > 0) {
                        e.preventDefault();
                        historyIndex--;
                        inputEl.value = messageHistory[messageHistory.length - 1 - historyIndex];
                    } else if (historyIndex === 0) {
                        e.preventDefault();
                        historyIndex = -1;
                        inputEl.value = '';
                    }
                    return;
                }

                // Enter Key: Send message
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const text = inputEl.value.trim();
                    if (!text) return;

                    // Save to history
                    messageHistory.push(text);
                    historyIndex = -1;

                    // Trigger the send function
                    if (typeof handleSendMessage === 'function') {
                        // Ensure textarea.value is populated so handleSendMessage grabs it
                        inputEl.value = text;
                        handleSendMessage(e);
                    } else if (typeof sendMessage === 'function') {
                        sendMessage();
                    } else if (sendBtn) {
                        sendBtn.click();
                    }
                }
            });
        });
    })();
    </script>
    
    
    <script>
    let chatHistory = [];
    let historyIdx = -1;

    // Ensure handleSendMessage correctly grabs the textarea value and clears it
    window.addEventListener('DOMContentLoaded', () => {
        const ta = document.getElementById('textarea');
        if (!ta) return;

        ta.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp') {
                if (chatHistory.length > 0) {
                    e.preventDefault();
                    if (historyIdx < chatHistory.length - 1) {
                        historyIdx++;
                    }
                    ta.value = chatHistory[chatHistory.length - 1 - historyIdx];
                }
                return;
            }

            if (e.key === 'ArrowDown') {
                if (historyIdx > 0) {
                    e.preventDefault();
                    historyIdx--;
                    ta.value = chatHistory[chatHistory.length - 1 - historyIdx];
                } else if (historyIdx === 0) {
                    e.preventDefault();
                    historyIdx = -1;
                    ta.value = '';
                }
                return;
            }

            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const val = ta.value.trim();
                if (val) {
                    chatHistory.push(val);
                    historyIdx = -1;
                }
                if (typeof handleSendMessage === 'function') {
                    handleSendMessage(e);
                }
            }
        });
    });
    </script>
    </body>
