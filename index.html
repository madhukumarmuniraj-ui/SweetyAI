<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweety AI - Chat</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#1e1e1e] text-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- SIDEBAR -->
    <div id="sidebar" class="w-64 bg-[#171717] flex flex-col justify-between border-r border-gray-800 transition-all duration-300">
        <div>
            <!-- New Chat Button -->
            <div class="p-3">
                <button onclick="newChat()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-700 hover:bg-gray-800 text-sm font-medium transition">
                    <i class="fa-solid fa-plus text-xs"></i> New chat
                </button>
            </div>
            <!-- Chat History List -->
            <div class="px-3 py-2 space-y-1 overflow-y-auto max-h-[calc(100vh-130px)] text-sm">
                <div class="text-xs font-semibold text-gray-500 px-3 py-1">Today</div>
                <button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-800 truncate text-gray-300 transition">Sweety AI Architecture</button>
                <button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-800 truncate text-gray-300 transition">Electron IPC setup</button>
            </div>
        </div>
        <!-- User Profile / Footer -->
        <div class="p-3 border-t border-gray-800 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">S</div>
            <span class="text-sm font-medium truncate">Sweety AI User</span>
        </div>
    </div>

    <!-- MAIN CHAT CONTAINER -->
    <div class="flex-1 flex flex-col h-full bg-[#212121]">

        <!-- Top Bar -->
        <div class="h-14 border-b border-gray-800 flex items-center px-4 justify-between bg-[#212121]">
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white px-2 py-1 rounded">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="flex items-center gap-2 text-sm font-semibold text-gray-300"><img src="/logo.png" alt="SweetyAI" class="w-6 h-6 rounded-md shadow">Sweety AI v1.0</span>
            <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer select-none" title="Search your local legal knowledge base">
                <input type="checkbox" id="ragToggle" checked class="accent-emerald-500">
                RAG
            </label>
        </div>

        <!-- Chat History Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Welcome Greeting -->
            <div class="max-w-3xl mx-auto text-center mt-12 space-y-3">
                <img src="/logo.png" alt="SweetyAI" class="w-20 h-20 mx-auto rounded-2xl shadow-lg">
                <h1 class="text-3xl font-bold tracking-tight">What can I help with today?</h1>
            </div>
        </div>

        <!-- Bottom Input Form -->
        <div class="p-4 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent">
            <div class="max-w-3xl mx-auto">
                <form id="chat-form" class="relative bg-[#2f2f2f] rounded-2xl border border-gray-700 focus-within:border-gray-500 shadow-lg">
                    <textarea id="textarea" rows="1" placeholder="Message Sweety AI..."
                        class="w-full bg-transparent px-4 py-3.5 pr-12 text-gray-100 placeholder-gray-400 focus:outline-none resize-none max-h-48 text-sm"></textarea>
                    <button type="submit" id="send-btn" class="absolute right-2.5 bottom-2.5 bg-white text-black p-2 rounded-xl hover:bg-gray-200 transition disabled:opacity-40" disabled>
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </form>
                <div class="text-center text-xs text-gray-500 mt-2">
                    Sweety AI can make mistakes. Verify important info.
                </div>
            </div>
        </div>

    </div>

    <!-- Chat logic and UI interactions -->
    <script>
        const textarea = document.getElementById('textarea');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');

        const API_BASE = "http://127.0.0.1:8765";
        const WELCOME_HTML = `
            <div class="max-w-3xl mx-auto text-center mt-12 space-y-3">
                <img src="./logo.png" alt="SweetyAI" class="w-20 h-20 mx-auto rounded-2xl shadow-lg">
                <h1 class="text-3xl font-bold tracking-tight">What can I help with today?</h1>
            </div>`;

        let chatHistory = [];
        let historyIndex = -1;

        // Auto-resize + enable/disable send button
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        // Enter to send, Shift+Enter for newline, Up/Down for history recall
        textarea.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowUp' && chatHistory.length > 0) {
                event.preventDefault();
                if (historyIndex < chatHistory.length - 1) historyIndex++;
                textarea.value = chatHistory[chatHistory.length - 1 - historyIndex];
                sendBtn.disabled = false;
                return;
            }
            if (event.key === 'ArrowDown' && historyIndex >= 0) {
                event.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    textarea.value = chatHistory[chatHistory.length - 1 - historyIndex];
                } else {
                    historyIndex = -1;
                    textarea.value = '';
                }
                sendBtn.disabled = textarea.value.trim() === '';
                return;
            }
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSendMessage(event);
            }
        });

        chatForm.addEventListener('submit', handleSendMessage);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-0');
            sidebar.classList.toggle('overflow-hidden');
        }

        function newChat() {
            chatContainer.innerHTML = WELCOME_HTML;
            chatHistory = [];
            historyIndex = -1;
        }

        function appendBubble({ role, html, extraClass = '' }) {
            const bubble = document.createElement('div');
            bubble.className = `max-w-3xl mx-auto flex gap-4 px-4 ${extraClass}`;
            const badge = role === 'user'
                ? '<div class="w-8 h-8 rounded-full bg-indigo-600 flex-shrink-0 flex items-center justify-center font-bold text-sm">U</div>'
                : '<div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center font-bold text-sm">S</div>';
            bubble.innerHTML = `${badge}<div class="flex-1 space-y-1 text-gray-200 text-sm leading-relaxed whitespace-pre-wrap">${html}</div>`;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleSendMessage(event) {
            if (event) event.preventDefault();
            const message = textarea.value.trim();
            if (!message) return;

            if (chatContainer.querySelector('h1')) {
                chatContainer.innerHTML = '';
            }

            appendBubble({ role: 'user', html: escapeHtml(message) });

            chatHistory.push(message);
            historyIndex = -1;
            textarea.value = '';
            textarea.style.height = 'auto';
            sendBtn.disabled = true;

            const isRagMode = document.getElementById('ragToggle') ? document.getElementById('ragToggle').checked : true;
            const endpoint = isRagMode ? `${API_BASE}/rag-chat` : `${API_BASE}/chat`;

            sendBtn.classList.add('opacity-40');

            fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
                .then(res => res.json())
                .then(data => {
                    const replyText = data.response || data.reply || data.answer || JSON.stringify(data);
                    appendBubble({ role: 'assistant', html: escapeHtml(replyText), extraClass: 'bg-[#2a2a2a]/50 py-4 rounded-xl' });
                })
                .catch(() => {
                    appendBubble({
                        role: 'assistant',
                        html: 'Backend Connection Error: Cannot reach the Python server. Start it with <code>python3 server.py</code>.',
                        extraClass: 'bg-red-900/50 py-4 rounded-xl text-red-200'
                    });
                })
                .finally(() => {
                    sendBtn.classList.remove('opacity-40');
                    sendBtn.disabled = textarea.value.trim() === '';
                });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
